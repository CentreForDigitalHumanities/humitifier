{% extends 'base/base_page_template.html' %}

{% block content %}
    <div class="h-full--header w-full bg-default px-7 py-5">
        <h1 class="text-2xl font-bold mb-6">Delete acknowledgment</h1>

        <div class="max-w-2xl bg-white dark:bg-gray-900 rounded-md border border-gray-200 dark:border-gray-700 overflow-hidden transition duration-150">
            <div class="px-4 py-2.5 bg-gray-50 dark:bg-gray-800/60 border-b border-gray-200 dark:border-gray-800 font-semibold text-sm">
                Confirm Deletion
            </div>

            <div class="p-4 text-sm">
                <div class="rounded-md border-l-4 px-3 py-2 text-sm border-red-500 bg-red-100 text-red-900 dark:bg-red-950/60 dark:text-red-200">
                    Are you sure you want to delete this acknowledgment?
                </div>

                <form method="post" class="mt-6">
                    {% csrf_token %}
                    {{ form }}
                    <div class="flex gap-2 mt-6">
                        <button type="submit" class="btn btn-danger">
                            Confirm
                        </button>
                        <a href="{% url 'alerting:acknowledgments' %}" class="btn btn-sm btn-outline">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

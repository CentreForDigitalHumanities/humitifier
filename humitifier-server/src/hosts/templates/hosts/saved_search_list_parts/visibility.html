{% if object.is_public %}
    <span class="rounded-full border px-2.5 py-0.5 text-xs border-green-500 bg-green-100 text-green-900 dark:bg-green-950/60 dark:text-green-200">Public</span>
{% else %}
    <span class="rounded-full border px-2.5 py-0.5 text-xs border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400">Private</span>
{% endif %}

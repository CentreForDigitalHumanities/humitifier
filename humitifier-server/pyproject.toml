[tool.black]
target-version = [
    "py314",
]

[tool.poetry]
name = "humitifier-server"
version = "6.0.0"
description = ""
authors = [
    "Mees, T.D. (Ty) <t.d.mees@uu.nl>",
]

[tool.poetry.dependencies]
python = "^3.14"
django = "^5.2"
bpython = "^0.26"
django-braces = "^1.17.0"
djangorestframework = "^3.18.3"
django-filter = "^26.2"
markdown = "^3.11"
django-debug-toolbar = "^7.1.0"
django-simple-menu = "^2.1.4"
whitenoise = "^6.12.0"
sentry-sdk = {extras = ["celery", "django"], version = "^2.47.0"}
mozilla-django-oidc = "^5.0.2"
drf-spectacular = "^0.30.0"
django-oauth-toolkit = "^3.4.0"
celery = {extras = ["redis"], version = "5.7.0"}
django-celery-beat = "^2.8.1"
django-celery-results = "^2.6.0"
cron-descriptor = "^2.0.6"
openpyxl = "^3.1.5"
psycopg = "^3.3.8"
pydantic-settings = "^2.16.2"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
psycopg-binary = "^3.3.8"
faker = "^40.52.0"
humitifier-common = { path = "../humitifier-common",  develop = true }
flower = "^2.2.0"

[tool.poetry.group.production]
optional = true

[tool.poetry.group.production.dependencies]
psycopg-c = "^3.3.8"
gunicorn = "^26.2.0"
humitifier-common = { path = "../humitifier-common" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
